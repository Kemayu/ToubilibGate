networks:
  toubilib.net:
    driver: bridge

services:
  # service api.toubilib : api complète pour la prise de rdv
  api.toubilib:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6080:80'
    volumes:
      - ./app:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprat.db
      - toubiauth.db
      - toubirdv.db
      - toubipat.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # Gateway
  gateway.toubilib:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6081:80'
    volumes:
      - ./gateway:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - app.auth
      - app.praticiens
      - app.rdv
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # Microservice authentification
  app.auth:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6082:80'
    volumes:
      - ./app-auth:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubirdv.db
      - toubiprat.db
      - toubiauth.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"
    environment:
      - SERVICE_TYPE=auth

  # Microservice praticiens
  app.praticiens:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6083:80'
    volumes:
      - ./app-praticiens:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprat.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"
    environment:
      - SERVICE_TYPE=praticiens

  # Microservice rendez-vous
  app.rdv:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6084:80'
    volumes:
      - ./app-rdv:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      toubirdv.db:
        condition: service_started
      toubiprat.db:
        condition: service_started
      rabbitmq:
           condition: service_healthy
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"
    environment:
      - SERVICE_TYPE=rdv
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=toubi
      - RABBITMQ_PASSWORD=toubi

  #######################################
  ### RabbitMQ Service
  #######################################
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '15672:15672'
      - '5672:5672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 8s
      timeout: 30s
      retries: 3
    networks:
      - toubilib.net
    volumes:
      - ./rabbitmq.toubi:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=toubi
      - RABBITMQ_DEFAULT_PASS=toubi

  ##############################################
  ###  MailCatcher
  ##############################################
  mail.toubi:
    build:
      context: build
      dockerfile: mailcatcher.Dockerfile
    networks:
      - toubilib.net
    ports:
      - '1025:1025'
      - '1080:1080'

 

  # service toubiprat.db : base de données postgresql pour les praticiens
  toubiprat.db:
    image: 'postgres:latest'
    env_file: ./env/toubipratdb.env
    ports:
      - '5432:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/prati:/docker-entrypoint-initdb.d/

  toubiauth.db:
    image: 'postgres:latest'
    env_file: ./env/toubiauthdb.env
    ports:
      - '5436:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/auth:/docker-entrypoint-initdb.d/

  toubirdv.db:
    image: 'postgres:latest'
    env_file: ./env/toubirdvdb.env
    ports:
       - '5434:5432' 
    networks: 
       - toubilib.net
    volumes:
       - ./sql/rdv:/docker-entrypoint-initdb.d/

  toubipat.db: 
    image: 'postgres:latest'
    env_file: ./env/toubipatdb.env
    ports:
      - '5438:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/pat:/docker-entrypoint-initdb.d/

  # Service administration des bases sql
  adminer:
    image: adminer
    ports:
      - '8080:8080'
    networks:
      - toubilib.net